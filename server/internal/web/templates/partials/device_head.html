{{define "device_head"}}
{{with .Device}}
<div class="page-head device-head">
  <div>
    <p class="crumbs"><a href="/devices">Devices</a> /</p>
    <h1>{{.Name}}</h1>
    <p class="muted small"><span class="mono">{{.ID}}</span> · firmware {{.FWVersion}}{{if .NeedsUpdate}} · <a class="accent" href="/devices/{{.ID}}/settings">update available</a>{{end}}</p>
  </div>
  {{template "device_badge" .}}
</div>
<nav class="tabs-nav">
  <a href="/devices/{{.ID}}" {{if eq $.Tab "apps"}}class="on"{{end}}>Apps <span class="count">{{.AppCount}}</span></a>
  <a href="/devices/{{.ID}}/settings" {{if eq $.Tab "settings"}}class="on"{{end}}>Settings</a>
</nav>
{{end}}
{{if .Paired}}<div class="notice">Paired. Install an app to get started.</div>{{end}}
{{end}}
