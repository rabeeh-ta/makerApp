; espHog firmware for the Adafruit Feather ESP32-S3 Reverse TFT (DeskHog board).
; Built by `make firmware` at the repo root; the server embeds the output and
; flashes it from the browser, so you normally never run this directly.

[env:feather_s3_rtft]
platform = espressif32@^6.9.0
board = adafruit_feather_esp32s3_reversetft
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:version.py
; USB_MODE=1 uses the chip's built-in USB serial/JTAG. The browser flasher
; can then reset the board into the bootloader without button presses.
build_flags =
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
  -DWEBSOCKETS_MAX_DATA_SIZE=24576
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  bblanchon/ArduinoJson@^7.2.1
  links2004/WebSockets@^2.6.1
  adafruit/Adafruit MAX1704X@^1.0.3
